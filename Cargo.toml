[package]
name = "firelang"
version = "0.1.0"
edition = "2021"
autobins = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
firestore = "0.49"
gcloud-sdk = "0.30"
prost-types = "0.14"
tokio = { version = "1", features = ["net", "rt", "time"] }

[[bin]]
name = "fl"
path = "src/main.rs"
