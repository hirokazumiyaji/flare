[package]
name = "flare"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "An mruby-inspired scripting language runtime for Firestore, Cloud Storage, and Authentication"
license = "MIT"
repository = "https://github.com/hirokazumiyaji/flare"
readme = "README.md"
keywords = ["firebase", "firestore", "scripting", "language", "repl"]
categories = ["command-line-utilities", "development-tools"]
autobins = false

[features]
# Keep the default build focused on the in-memory backend and CLI REPL.
# The emulator client is deliberately opt-in so embedding flare does not
# pull the Firestore SDK, gRPC, and TLS dependency layers. Terminal control
# (rustyline) is encapsulated in the `cli` feature so embedding flare without
# default features stays minimal.
default = ["cli"]
cli = ["dep:rustyline"]
emulator = [
    "dep:firestore",
    "dep:gcloud-sdk",
    "dep:http",
    "dep:prost-types",
    "dep:reqwest",
    "dep:tokio",
]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
csv = "1"
firestore = { version = "0.60", optional = true }
gcloud-sdk = { version = "0.33", optional = true }
http = { version = "1", optional = true }
prost-types = { version = "0.14", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json"], optional = true }
rustyline = { version = "18.0.1", optional = true }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["net", "rt", "time"], optional = true }

[dev-dependencies]
proptest = "1"
tempfile = "3"

[[bin]]
name = "fl"
path = "src/main.rs"
required-features = ["cli"]

[[bench]]
name = "query_payload"
harness = false

[[bench]]
name = "interpreter"
harness = false

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["cli"]

[[test]]
name = "repl"
path = "tests/repl.rs"
required-features = ["cli"]

[[test]]
name = "release"
path = "tests/release.rs"
required-features = ["cli"]

[[test]]
name = "firestore_emulator"
path = "tests/firestore_emulator.rs"
required-features = ["emulator"]

[[test]]
name = "auth_emulator"
path = "tests/auth_emulator.rs"
required-features = ["emulator"]
