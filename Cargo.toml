[package]
name = "firelang"
version = "0.1.0"
edition = "2021"
autobins = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.9", features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
url = "2.5"

[[bin]]
name = "fl"
path = "src/main.rs"
