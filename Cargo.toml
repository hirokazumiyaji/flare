[package]
name = "flare"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "An mruby-inspired scripting language runtime for Firestore, Cloud Storage, and Authentication"
license = "MIT"
repository = "https://github.com/hirokazumiyaji/flare"
readme = "README.md"
keywords = ["firebase", "firestore", "scripting", "language", "repl"]
categories = ["command-line-utilities", "development-tools"]
autobins = false

[features]
# Keep the default build focused on the in-memory backend.  The emulator
# client is deliberately opt-in so embedding flare does not pull the
# Firestore SDK, gRPC, and TLS dependency layers. Future Auth / Storage
# clients should follow the same service-specific feature pattern.
default = []
emulator = [
    "dep:firestore",
    "dep:gcloud-sdk",
    "dep:prost-types",
    "dep:reqwest",
    "dep:tokio",
]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
csv = "1"
firestore = { version = "0.58", optional = true }
gcloud-sdk = { version = "0.33", optional = true }
prost-types = { version = "0.14", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json"], optional = true }
rustyline = "18.0.1"
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["net", "rt", "time"], optional = true }

[dev-dependencies]
serde_json = "1"

[[bin]]
name = "fl"
path = "src/main.rs"

[[bench]]
name = "query_payload"
harness = false

[[test]]
name = "firestore_emulator"
path = "tests/firestore_emulator.rs"
required-features = ["emulator"]

[[test]]
name = "auth_emulator"
path = "tests/auth_emulator.rs"
required-features = ["emulator"]
