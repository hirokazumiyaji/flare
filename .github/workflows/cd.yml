name: CD

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# This is the Firebase CLI version used by the CI emulator job.  Keep it in
# sync with ci.yml and record it with every release.
env:
  FIREBASE_TOOLS_VERSION: "15.31.0"

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Record build toolchain
        run: |
          set -euo pipefail
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          echo "image_os=${ImageOS:-unknown}"
          echo "image_version=${ImageVersion:-unknown}"
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version --verbose
          echo "cargo_lock_sha256=$(sha256sum Cargo.lock | awk '{print $1}')"
          echo "firebase_tools_for_ci=${FIREBASE_TOOLS_VERSION}"

      - name: Verify locked dependency graph
        run: cargo metadata --locked --no-deps --format-version 1 >/dev/null

      - name: Build release binary
        # Name the target so the release layout does not depend on the runner's
        # default host target.
        run: cargo build --locked --release --bin fl --target x86_64-unknown-linux-gnu

      - name: Package artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/fl dist/fl-linux-x86_64
          {
            echo "release_tag=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "image_os=${ImageOS:-unknown}"
            echo "image_version=${ImageVersion:-unknown}"
            echo "rust=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "target=x86_64-unknown-linux-gnu"
            echo "cargo_lock_sha256=$(sha256sum Cargo.lock | awk '{print $1}')"
            echo "firebase-tools=${FIREBASE_TOOLS_VERSION}"
            echo "firebase_tools_for_ci=${FIREBASE_TOOLS_VERSION}"
          } > dist/tool-versions.txt
          cat dist/tool-versions.txt

      - name: Upload artifact to workflow
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fl-linux-x86_64
          path: |
            dist/fl-linux-x86_64
            dist/tool-versions.txt

      - name: Publish GitHub Release asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body: |
            Reproducible build metadata is attached as `tool-versions.txt`.
            Rust 1.98.1 is pinned by `rust-toolchain.toml`; the CI Firestore emulator uses Firebase CLI ${{ env.FIREBASE_TOOLS_VERSION }}.
          files: |
            dist/fl-linux-x86_64
            dist/tool-versions.txt
