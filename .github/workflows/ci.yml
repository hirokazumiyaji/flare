name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - name: Test in-memory-only build
        run: cargo test --no-default-features --all-targets

      - name: Build release binary
        run: cargo build --release --bin fl

  # Keep the optional dependency boundary covered in CI.  The default build
  # is in-memory-only; `emulator` is the explicit opt-in build.
  feature-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            cargo_args: ""
          - name: in-memory-only
            cargo_args: "--no-default-features"
          - name: emulator
            cargo_args: "--features emulator"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test ${{ matrix.name }} build
        run: cargo test --all-targets ${{ matrix.cargo_args }}

      - name: Lint ${{ matrix.name }} build
        run: cargo clippy --all-targets ${{ matrix.cargo_args }} -- -D warnings

      - name: Build release emulator binary
        if: matrix.name == 'emulator'
        run: cargo build --release --features emulator --bin fl

  # Firestore emulator integration tests (Task 06). Uses firebase-tools + Java.
  integration-emulator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run integration tests with Firestore emulator
        run: |
          firebase emulators:exec --only firestore --project demo-firelang \
            'FIRESTORE_PROJECT_ID=demo-firelang cargo test --features emulator --test firestore_emulator -- --nocapture'
