name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - name: Build release binary
        run: cargo build --release --bin fl

  # Firestore emulator integration tests (Task 06). Uses firebase-tools + Java.
  integration-emulator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run integration tests with Firestore emulator
        run: |
          firebase emulators:exec --only firestore --project demo-firelang \
            'FIRESTORE_PROJECT_ID=demo-firelang cargo test --test firestore_emulator -- --nocapture'

      - name: Run integration tests with Auth emulator
        run: |
          firebase emulators:exec --only auth --project demo-firelang \
            'FIREBASE_PROJECT_ID=demo-firelang cargo test --test auth_emulator -- --nocapture'
