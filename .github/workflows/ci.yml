name: CI

on:
  # CD calls this workflow for release tags.  Keeping the same job graph for
  # branch/PR runs and workflow_call runs prevents the release path from
  # drifting from the normal quality gate.
  workflow_call:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        run: |
          rustup default 1.98.1
          rustup component add rustfmt clippy

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --locked

      - name: Build release binary
        run: cargo build --release --bin fl --locked

  # Firestore emulator integration tests (Task 06).  This job is also run when
  # the workflow is called by CD, so a release cannot skip the emulator suite.
  integration-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        run: |
          rustup default 1.98.1
          rustup component add rustfmt clippy

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Run integration tests with Firestore emulator
        run: |
          firebase emulators:exec --only firestore --project demo-firelang \
            'FIRESTORE_PROJECT_ID=demo-firelang cargo test --test firestore_emulator --locked -- --nocapture'
