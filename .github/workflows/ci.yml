name: CI

on:
  # CD calls this workflow for release tags.  Keeping the same job graph for
  # branch/PR runs and workflow_call runs prevents the release path from
  # drifting from the normal quality gate.
  workflow_call:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --locked

      - name: Verify default feature set is in-memory-only
        run: |
          set -euo pipefail
          test "$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["features"].get("default", []))')" = "[]"
          # The main acceptance criterion is that an in-memory-only build does
          # not link the emulator SDK. Assert the resolved dependency graph, not
          # just the declared feature list: re-declaring firestore / gcloud-sdk
          # / prost-types as non-optional would leave the line above green while
          # restoring the resolution, compile-time and binary-size costs.
          if cargo tree --prefix none --edges normal --no-default-features \
            | grep -E '^(firestore|gcloud-sdk|prost-types) v'; then
            echo "emulator SDK must not be in the default dependency graph" >&2
            exit 1
          fi

      - name: Build release binary
        run: cargo build --release --bin fl --locked

  # Keep the optional dependency boundary covered in CI.  The default build
  # is in-memory-only; `emulator` is the explicit opt-in build.
  feature-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            cargo_args: ""
          # Issue #99 asks for this leg explicitly. Today `default = []`, so it
          # is a no-op -- but the moment a default feature appears, the default
          # leg keeps passing while minimal consumers hit an unverified build.
          - name: no-default-features
            cargo_args: "--no-default-features"
          - name: emulator
            cargo_args: "--features emulator"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Test ${{ matrix.name }} build
        run: cargo test --all-targets ${{ matrix.cargo_args }}

      - name: Lint ${{ matrix.name }} build
        run: cargo clippy --all-targets ${{ matrix.cargo_args }} -- -D warnings

      - name: Build release emulator binary
        if: matrix.name == 'emulator'
        run: cargo build --release --features emulator --bin fl

  # Firestore and Storage emulator integration tests.  This job is also run
  # when the workflow is called by CD, so a release cannot skip the emulator
  # suite.
  integration-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Install firebase-tools
        run: npm install -g firebase-tools@15.31.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run integration tests with Firestore and Storage emulators
        run: |
          firebase emulators:exec --only firestore,storage --project demo-firelang \
            'FIRESTORE_PROJECT_ID=demo-firelang FIREBASE_PROJECT_ID=demo-firelang cargo test --features emulator --test firestore_emulator --test storage_emulator --locked -- --nocapture'
