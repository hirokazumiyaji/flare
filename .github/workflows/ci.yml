name: CI

on:
  # CD calls this workflow for release tags.  Keeping the same job graph for
  # branch/PR runs and workflow_call runs prevents the release path from
  # drifting from the normal quality gate.
  workflow_call:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

# Keep the Firebase version in sync with docs/release-checklist.md.  The jobs
# below log their tools so a runner image or tool update is visible in the log.
env:
  FIREBASE_TOOLS_VERSION: "15.31.0"

jobs:
  cargo-deny:
    name: Dependency check (cargo-deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check dependencies with cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: ""
          command-arguments: "advisories bans licenses sources"

  doc:
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          # This action version fails when `toolchain` is empty and has no
          # rust-toolchain.toml fallback, so keep this equal to the file's channel.
          toolchain: 1.98.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --locked

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          # This action version fails when `toolchain` is empty and has no
          # rust-toolchain.toml fallback, so keep this equal to the file's channel.
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Record Rust toolchain
        run: |
          set -euo pipefail
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          echo "image_os=${ImageOS:-unknown}"
          echo "image_version=${ImageVersion:-unknown}"
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version --verbose
          if command -v sha256sum >/dev/null 2>&1; then
            echo "cargo_lock_sha256=$(sha256sum Cargo.lock | awk '{print $1}')"
          else
            echo "cargo_lock_sha256=$(shasum -a 256 Cargo.lock | awk '{print $1}')"
          fi

      - name: Verify locked dependency graph
        run: cargo metadata --locked --no-deps --format-version 1 >/dev/null

      - name: Format check
        if: matrix.os == 'ubuntu-24.04'
        # cargo fmt has no dependency resolver; the --locked metadata check above
        # is the lockfile gate for this step.
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --locked

      - name: Check fuzz targets
        if: matrix.os == 'ubuntu-24.04'
        run: cargo check --manifest-path fuzz/Cargo.toml --locked

      - name: Verify default feature set is in-memory-only
        if: matrix.os == 'ubuntu-24.04'
        run: |
          set -euo pipefail
          test "$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["features"].get("default", []))')" = "[]"
          # The main acceptance criterion is that an in-memory-only build does
          # not link the emulator SDK. Assert the resolved dependency graph, not
          # just the declared feature list: re-declaring firestore / gcloud-sdk
          # / prost-types as non-optional would leave the line above green while
          # restoring the resolution, compile-time and binary-size costs.
          if cargo tree --prefix none --edges normal --no-default-features \
            | grep -E '^(firestore|gcloud-sdk|prost-types) v'; then
            echo "emulator SDK must not be in the default dependency graph" >&2
            exit 1
          fi

      - name: Build release binary
        run: cargo build --release --bin fl --locked

  # Keep the optional dependency boundary covered in CI.  The default build
  # is in-memory-only; `emulator` is the explicit opt-in build.
  feature-builds:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            cargo_args: ""
          # Issue #99 asks for this leg explicitly. Today `default = []`, so it
          # is a no-op -- but the moment a default feature appears, the default
          # leg keeps passing while minimal consumers hit an unverified build.
          - name: no-default-features
            cargo_args: "--no-default-features"
          - name: emulator
            cargo_args: "--features emulator"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          # This action version fails when `toolchain` is empty and has no
          # rust-toolchain.toml fallback, so keep this equal to the file's channel.
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Test ${{ matrix.name }} build
        run: cargo test --all-targets --locked ${{ matrix.cargo_args }}

      - name: Lint ${{ matrix.name }} build
        run: cargo clippy --all-targets ${{ matrix.cargo_args }} --locked -- -D warnings

      - name: Build release emulator binary
        if: matrix.name == 'emulator'
        run: cargo build --release --features emulator --bin fl --locked

  # Firestore and Storage emulator integration tests.  This job is also run
  # when the workflow is called by CD, so a release cannot skip the emulator
  # suite.
  integration-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          # This action version fails when `toolchain` is empty and has no
          # rust-toolchain.toml fallback, so keep this equal to the file's channel.
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21.0.8"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.11.0"

      - name: Install firebase-tools
        run: |
          set -euo pipefail
          # Keep this explicit package spec in sync with FIREBASE_TOOLS_VERSION.
          npm install --global --no-fund --no-audit firebase-tools@15.31.0
          firebase_cli_version="$(firebase --version)"
          echo "firebase_cli=${firebase_cli_version}"
          test "${firebase_cli_version}" = "${FIREBASE_TOOLS_VERSION}"

      - name: Record emulator toolchain
        run: |
          set -euo pipefail
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          echo "image_os=${ImageOS:-unknown}"
          echo "image_version=${ImageVersion:-unknown}"
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version --verbose
          node --version
          npm --version
          java -version 2>&1 || true
          echo "firebase_tools=${FIREBASE_TOOLS_VERSION}"
          echo "firebase_cli=$(firebase --version)"
          echo "cargo_lock_sha256=$(sha256sum Cargo.lock | awk '{print $1}')"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run integration tests with allow-all emulator rules, twice
        # Two passes in the same emulator session: fixtures from the first run
        # stay in the datastore, so a suite that only passes on a clean
        # emulator (unscoped collections, or `!=` queries that match other
        # tests' documents) fails here.
        run: |
          firebase emulators:exec --config firebase.emulators.json --only firestore --project demo-flare \
            'set -eu
              env | grep -q "^FIRESTORE_EMULATOR_HOST="
              for run in 1 2; do
                FIRESTORE_PROJECT_ID=demo-flare cargo test --features emulator --test firestore_emulator --test cli --locked -- --nocapture
              done'

      - name: Verify deploy config denies Firestore writes
        run: |
          set -euo pipefail
          # `--exact` は対象テストが 0 件でも終了コード 0 になるため、
          # 名前が変わっていないことを先に確認する。
          cargo test --features emulator --test firestore_emulator --locked -- --list \
            | grep -Fqx 'production_config_denies_firestore_writes: test'
          # テストは FLARE_FIRESTORE_RULES が "deny" でなければ黙って
          # 成功する。変数名をどちらかの側で変更すると、この検査が
          # assertion を一度も実行しないまま緑になってしまうため、
          # テストと同じシェルで変数が実際に渡っていることを確認する。
          firebase emulators:exec --config firebase.json --only firestore --project demo-flare \
            'FIRESTORE_PROJECT_ID=demo-flare FLARE_FIRESTORE_RULES=deny sh -c '"'"'
               test "$FLARE_FIRESTORE_RULES" = deny || {
                 echo "FLARE_FIRESTORE_RULES did not reach the test process" >&2
                 exit 1
               }
               cargo test --features emulator --test firestore_emulator --locked production_config_denies_firestore_writes -- --exact --nocapture
             '"'"''

      - name: Run integration tests with Firestore and Storage emulators
        run: |
          firebase emulators:exec --config firebase.emulators.json --only firestore,storage --project demo-flare \
            'FIRESTORE_PROJECT_ID=demo-flare FIREBASE_PROJECT_ID=demo-flare cargo test --features emulator --test firestore_emulator --test storage_emulator --locked -- --nocapture'

      - name: Run integration tests with Auth emulator
        run: |
          firebase emulators:exec --config firebase.emulators.json --only auth --project demo-flare \
            'FIREBASE_PROJECT_ID=demo-flare cargo test --features emulator --test auth_emulator --locked -- --nocapture'

